[project]
name = "scm-broker-mcp"
version = "0.1.0"
description = "Provider-neutral pull-request MCP server for GitHub and Bitbucket Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12.0,<2", "httpx>=0.27.0", "pydantic>=2.7.0"]

[project.scripts]
scm-broker-mcp-http = "scm_broker_mcp.main:http_main"
scm-broker-mcp-stdio = "scm_broker_mcp.main:stdio_main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scm_broker_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
